name: aether_app
description: Aether - a Binance Spot market research app (not a trading app).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  go_router: ^14.2.0
  get_it: ^7.7.0
  dio: ^5.5.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  intl: ">=0.19.0 <1.0.0"
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/mock/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono_400Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono_500Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono_700Bold.ttf
          weight: 700

# Branding (run once after `flutter create`, and again if the images change):
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# Images are generated by tool/generate_branding.py.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0D131E"
  adaptive_icon_foreground: assets/branding/icon_foreground.png

flutter_native_splash:
  color: "#0D131E"
  image: assets/branding/splash.png
  android_12:
    color: "#0D131E"
    image: assets/branding/splash.png
