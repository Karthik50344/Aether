name: release-apk

# Push a tag like v1.0.0 to build the APK and publish it as a GitHub Release.
# "Run workflow" in the Actions tab builds the APK and keeps it as a download
# on the run page, without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      # The release app needs this permission, or it cannot reach Binance.
      # It belongs in android/app/src/main/AndroidManifest.xml (not only the
      # debug one). Fail early instead of shipping an APK with no internet.
      - name: Check INTERNET permission
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml \
            || { echo "Add the INTERNET permission to android/app/src/main/AndroidManifest.xml"; exit 1; }

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create

      # Do not release anything that fails the checks.
      - run: flutter analyze
#      - run: flutter test

      - run: flutter build apk --release

      - name: Name the file
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/aether-${VERSION}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: aether-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
